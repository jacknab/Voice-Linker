<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Primary SEO -->
    <title>Completely Free Gay Chat Line &amp; Gay Party Line | Male Box</title>
    <meta name="description" content="Male Box is the #1 completely free gay chat line and gay party line for men in the US. Talk live to real local guys 24/7 — no app, no credit card, no limits." />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="author" content="Male Box" />
    <link rel="canonical" href="https://malebox.net/" />

    <!-- Open Graph (Facebook / social sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Male Box" />
    <meta property="og:title" content="Completely Free Gay Chat Line &amp; Gay Party Line | Male Box" />
    <meta property="og:description" content="Male Box is the #1 completely free gay chat line and gay party line for men in the US. Talk live to real local guys 24/7 — no app, no credit card, no limits." />
    <meta property="og:url" content="https://malebox.net/" />
    <meta property="og:image" content="/hero_mm.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Completely Free Gay Chat Line &amp; Gay Party Line | Male Box" />
    <meta name="twitter:description" content="Male Box is the #1 completely free gay chat line and gay party line for men in the US. Talk live to real local guys 24/7 — no app, no credit card, no limits." />
    <meta name="twitter:image" content="/hero_mm.png" />

    <!-- Structured Data: WebSite + Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "/#website",
          "name": "Male Box",
          "description": "Completely free gay chat line and gay party line for men in the US.",
          "inLanguage": "en-US",
          "potentialAction": {
            "@type": "SearchAction",
            "target": { "@type": "EntryPoint", "urlTemplate": "/cities?q={search_term_string}" },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "/#organization",
          "name": "Male Box",
          "alternateName": ["Male Box Gay Chat Line", "Male Box Gay Party Line", "Free Gay Chat Line"],
          "description": "Male Box is the #1 completely free gay chat line and gay party line for men in the US.",
          "audience": { "@type": "Audience", "audienceType": "Gay and Bisexual Men" }
        },
        {
          "@type": "Service",
          "name": "Male Box — Completely Free Gay Chat Line &amp; Gay Party Line",
          "serviceType": "Gay Phone Chat Line",
          "category": "Gay Chat Line",
          "areaServed": { "@type": "Country", "name": "United States" },
          "offers": {
            "@type": "Offer",
            "name": "Completely Free Service",
            "price": "0",
            "priceCurrency": "USD",
            "description": "Completely free gay chat line service for all callers — no credit card required",
            "availability": "https://schema.org/InStock"
          }
        }
      ]
    }
    </script>

    <!-- Hero image preload — boosts LCP by fetching the above-the-fold image
         before the browser discovers it inside the JS bundle -->
    <link rel="preload" as="image" href="/hero_mm.png" fetchpriority="high" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Google Fonts — only the 2 fonts actually used in CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
